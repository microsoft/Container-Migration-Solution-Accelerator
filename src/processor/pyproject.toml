[project]
name = "processor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework==1.3.0",
    "agent-framework-orchestrations==1.0.0b260507",
    "aiohttp==3.14.1",
    "art==6.5",
    "azure-ai-agents==1.2.0b5",
    "azure-ai-inference==1.0.0b9",
    "azure-ai-projects==2.1.0",
    "azure-appconfiguration==1.8.0",
    "azure-core==1.38.0",
    "azure-cosmos==4.15.0",
    "azure-identity==1.26.0b1",
    "azure-storage-blob==12.28.0",
    "azure-storage-file-datalake==12.23.0",
    "azure-storage-queue==12.15.0",
    "fastmcp==3.2.4",
    "jinja2==3.1.6",
    "kafka-python==2.3.2",
    "mcp==1.27.0",
    "openai==2.33.0",
    "psutil==7.2.2",
    "pytz==2026.1.post1",
    "sas-cosmosdb==0.1.5",
    "sas-storage==1.0.0",
    "tenacity==9.1.2",
]

[dependency-groups]
dev = [
    "pre-commit==4.5.1",
    "pytest==9.0.3",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = ["src/tests/*"]

[tool.uv]
prerelease = "allow"
override-dependencies = [
    "urllib3==2.7.0",
    "authlib==1.7.1",
    "idna==3.15",
    "starlette==1.3.1",
    "python-multipart==0.0.31",
    "pyjwt==2.13.0",
    "cryptography==48.0.1",
    "pydantic-settings==2.14.2",
]
