[project]
name = "aks-migration-agent-gsa"
version = "0.1.0"
description = "This code it used to migrate Google GKE or Amazon EKS clusters to Azure AKS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "azure-ai-agents==1.2.0b6",
    "azure-appconfiguration==1.8.0",
    "azure-identity==1.25.3",
    "azure-monitor-opentelemetry==1.8.7",
    "azure-search-documents==11.7.0b2",
    "azure-storage-blob==12.28.0",
    "azure-storage-queue==12.15.0",
    "fastapi[standard]==0.135.3",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.31",
    "protobuf==7.34.0",
    "sas-cosmosdb==0.1.5",
    "semantic-kernel[azure]==1.41.1",
    "uvicorn==0.42.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=6.2.1", "pytest-asyncio>=0.23.0"]

[tool.coverage.run]
omit = ["src/tests/*"]

[tool.uv]
override-dependencies = [
    "av==16.0.0",
    "starlette==0.49.1",
    "aiohttp==3.14.1",
    "azure-core==1.38.0",
    "urllib3==2.7.0",
    "requests==2.33.0",
    "werkzeug==3.1.6",
    "pygments==2.20.0",
    "black==26.3.1",
    "cryptography==48.0.1",
    "pyjwt==2.12.0",
    "pyopenssl==26.0.0",
    "idna==3.15",
]
