[project]
name = "aks-migration-agent-gsa"
version = "0.1.0"
description = "This code it used to migrate Google GKE or Amazon EKS clusters to Azure AKS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",
    "azure-ai-agents==1.2.0b3",
    "azure-appconfiguration==1.7.1",
    "azure-identity==1.25.0",
    "azure-monitor-opentelemetry==1.7.0",
    "azure-search-documents==11.6.0b12",
    "azure-storage-blob==12.26.0",
    "azure-storage-queue==12.13.0",
    "fastapi[standard]==0.116.1",
    "httpx==0.28.1",
    "pydantic-settings==2.10.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.27",
    "protobuf==7.34.0",
    "sas-cosmosdb==0.1.4",
    "semantic-kernel[azure]==1.40.0",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=6.2.1"]

[tool.uv]
override-dependencies = [
    "av==16.0.0",
    "starlette==0.49.1",
    "aiohttp==3.13.4",
    "azure-core==1.38.0",
    "urllib3==2.7.0",
    "requests==2.33.0",
    "werkzeug==3.1.4",
    "pygments==2.20.0",
    "black==26.3.1",
    "cryptography==46.0.7",
    "pyjwt==2.12.0",
    "pyopenssl==26.0.0",
]
